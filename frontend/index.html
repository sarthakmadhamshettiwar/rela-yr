<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relay-r</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" stroke="#8b5cf6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="brand-name">Relay-r</span>
            </div>

            <nav class="nav">
                <button class="nav-item active" data-tab="events">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
                        <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
                    </svg>
                    Events
                    <span class="nav-badge" id="navTotalEvents">0</span>
                </button>
                <button class="nav-item" data-tab="replay">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1 4 1 10 7 10"/>
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                    </svg>
                    Replay
                </button>
                <button class="nav-item" data-tab="settings">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    Settings
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="infra-status">
                    <div class="infra-item">
                        <span class="dot" id="dbDot"></span>
                        <span>Database</span>
                    </div>
                    <div class="infra-item">
                        <span class="dot" id="kafkaDot"></span>
                        <span>Kafka</span>
                    </div>
                    <div class="infra-item">
                        <span class="dot pulse" id="sseDot"></span>
                        <span>Live</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <div class="main">
            <div class="topbar">
                <h1 class="page-title" id="pageTitle">Events</h1>
                <div class="topbar-stats">
                    <div class="stat">
                        <span class="stat-value" id="totalEvents">0</span>
                        <span class="stat-label">total</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat">
                        <span class="stat-value" id="recentEvents">0</span>
                        <span class="stat-label">last 24h</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat">
                        <span class="stat-value" id="deadEvents" style="color: var(--red)">0</span>
                        <span class="stat-label">dead</span>
                    </div>
                </div>
            </div>

            <div class="content-area">

                <!-- Events -->
                <div id="events" class="tab-pane active">
                    <div class="toolbar">
                        <div class="search-box">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                            <input type="text" id="searchInput" placeholder="Search events, repos, senders...">
                        </div>
                        <select id="eventTypeFilter" class="select">
                            <option value="">All types</option>
                            <option value="push">push</option>
                            <option value="pull_request">pull_request</option>
                            <option value="issues">issues</option>
                            <option value="release">release</option>
                            <option value="fork">fork</option>
                        </select>
                        <select id="statusFilter" class="select">
                            <option value="">All statuses</option>
                            <option value="received">received</option>
                            <option value="dead">dead</option>
                        </select>
                        <button class="btn btn-ghost" onclick="refreshEvents()">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                            </svg>
                            Refresh
                        </button>
                    </div>
                    <div id="eventsTable" class="events-list"></div>
                </div>

                <!-- Replay -->
                <div id="replay" class="tab-pane">
                    <div class="panel">
                        <div class="panel-header">
                            <h3>Bulk Replay</h3>
                            <p class="panel-desc">Re-send a range of stored events back through the pipeline.</p>
                        </div>
                        <div class="panel-body">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>From</label>
                                    <input type="datetime-local" id="startDate" class="input">
                                </div>
                                <div class="form-group">
                                    <label>To</label>
                                    <input type="datetime-local" id="endDate" class="input">
                                </div>
                                <div class="form-group">
                                    <label>Event type</label>
                                    <select id="replayEventType" class="select">
                                        <option value="">All types</option>
                                        <option value="push">push</option>
                                        <option value="pull_request">pull_request</option>
                                        <option value="issues">issues</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn btn-ghost" onclick="previewReplay()">Preview</button>
                                <button class="btn btn-primary" onclick="startReplay()">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polygon points="5 3 19 12 5 21 5 3"/>
                                    </svg>
                                    Start Replay
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="panel" id="replayStatus" style="display:none">
                        <div class="panel-header"><h3>Progress</h3></div>
                        <div class="panel-body">
                            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                            <span class="progress-label" id="replayProgress">0/0 events processed</span>
                        </div>
                    </div>
                </div>

                <!-- Settings -->
                <div id="settings" class="tab-pane">
                    <div class="panel">
                        <div class="panel-header"><h3>Webhook Endpoint</h3></div>
                        <div class="panel-body">
                            <div class="form-row" style="align-items:flex-end">
                                <div class="form-group" style="flex:1">
                                    <label>Producer URL (point GitHub webhooks here)</label>
                                    <input type="text" id="webhookUrl" class="input" readonly>
                                </div>
                                <button class="btn btn-ghost" onclick="copyWebhookUrl()">Copy</button>
                            </div>
                        </div>
                    </div>

                    <div class="panel">
                        <div class="panel-header"><h3>Infrastructure</h3></div>
                        <div class="panel-body">
                            <div class="infra-detail">
                                <div class="infra-detail-row">
                                    <span>Kafka</span>
                                    <span class="status-text" id="kafkaStatus">Checking...</span>
                                </div>
                                <div class="infra-detail-row">
                                    <span>Database</span>
                                    <span class="status-text" id="dbStatus">Checking...</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="panel">
                        <div class="panel-header"><h3>Event Retention</h3></div>
                        <div class="panel-body">
                            <div class="form-row" style="align-items:flex-end">
                                <div class="form-group">
                                    <label>Delete events older than</label>
                                    <select id="retentionPeriod" class="select">
                                        <option value="7">7 days</option>
                                        <option value="30" selected>30 days</option>
                                        <option value="90">90 days</option>
                                        <option value="365">1 year</option>
                                    </select>
                                </div>
                                <button class="btn btn-danger" onclick="cleanupOldEvents()">Delete old events</button>
                                <button class="btn btn-danger" onclick="deleteAllEvents()">Delete all events</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Event Detail Modal -->
    <div id="eventModal" class="modal-overlay" style="display:none">
        <div class="modal">
            <div class="modal-head">
                <div class="modal-head-left">
                    <span class="event-type-badge" id="modalBadge">push</span>
                    <span class="modal-repo" id="modalRepo"></span>
                </div>
                <button class="icon-btn" onclick="closeModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="eventDetails"></div>
            <div class="modal-foot">
                <button class="btn btn-ghost" onclick="closeModal()">Close</button>
                <button class="btn btn-primary" id="replayBtn" onclick="replayEvent()">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1 4 1 10 7 10"/>
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                    </svg>
                    Replay
                </button>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
